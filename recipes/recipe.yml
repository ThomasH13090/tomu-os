---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: tomu-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-nvidia-gnome
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
      - source: usr
        destination: /usr/config
  # - type: copy
  #   from: files
  #   src: /files/podman_setup.sh
  #   dest: /podman_setup.sh
  # - type : rpm-ostree
  #   repos: 
  #     - https://terra.fyralabs.com/terra.repo  #terra for umbriel 
  #   install:
  #     - terra-release
  - type: dnf
    repos:
      copr:
        - atim/starship
        - avengemedia/dms
        - avengemedia/danklinux
    install:
      packages:
        - starship
        - quickshell-git
        - dankcalendar
        - matugen
        - uidmap
        - fuse-overlayfs
        - niri
        - dms
        - dms-greeter
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
          - io.github.tobagin.keysmith
          - org.onlyoffice.desktopeditors
          - io.github.flattool.Warehouse
          - com.getmailspring.Mailspring
          - com.jetbrains.Rider
          - com.heroicgameslauncher.hgl
          - com.usebottles.bottles
      - scope: user # Also add Flathub user repo, but no user packages
    
  - type: gnome-extensions
    install:
      - 307 # Dash-to-Dock
            # https://extensions.gnome.org/extension/307/dash-to-dock/
            # You can also specify PK ID number from the extension URL,
            # if you encounter the scenario where there are multiple extensions with the same name.
            # You don't need to look & search for this scenario, since module will automatically fail & inform you to put PK ID number instead
      - 779 # Clipboard Indicator by Tudmotu
    uninstall:
      - GSConnect # Uninstall step here should be used only for the extensions
                  # which are not installed through OS package manager in the base image,
                  # like extensions installed from gnome-extensions module

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
        - JetBrainsMono
      google-fonts:
        - Roboto
        - "Open Sans"

  - type: script
    # snippets:
      # - "wget https://download.jetbrains.com/toolbox/jetbrains-toolbox-3.8.1.88030.tar.gz" # example: download binary
      # - tar -xvf ./jetbrains-toolbox-3.8.1.88030.tar.gz -C /tmp/jetbrains-toolbox
      # - "ln -sf /usr/bin/ld.bfd /etc/alternatives/ld && ln -sf /etc/alternatives/ld /usr/bin/ld" # example: ld alternatives symlink workaround
    scripts:
      - main.sh # example: run files/scripts/myscript.sh
      # - myscript.nu # example: run files/scripts/myscript.nu

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
